<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Réseau Mobile</title>
    
    <!-- CSS de Leaflet (pour la carte) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Thème sombre épuré */
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent-color: #00ffcc;
            --accent-hover: #00ccaa;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-top: 0;
        }

        .info-box {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        #map {
            flex-grow: 1;
            height: 100%;
        }

        /* Mode sombre pour la carte */
        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out,
        .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Antennes & Réseau</h1>
        <p>Découvrez ce qui se cache autour de vous et comprenez votre connexion.</p>
        
        <button id="btn-geoloc">📍 Me géolocaliser</button>
        
        <div class="info-box" id="antenna-info">
            <i>Cliquez sur "Me géolocaliser" pour voir les antennes autour de vous.</i>
        </div>
    </div>

    <div id="map"></div>

    <!-- JS de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialisation de la carte (centrée sur la France par défaut)
        const map = L.map('map').setView([46.603354, 1.888334], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 2. Géolocalisation de l'utilisateur
        document.getElementById('btn-geoloc').addEventListener('click', () => {
            document.getElementById('antenna-info').innerHTML = "<i>Recherche de votre position...</i>";
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    map.setView([lat, lng], 14);
                    L.marker([lat, lng]).addTo(map).bindPopup("<b>Vous êtes ici</b>").openPopup();
                    
                    document.getElementById('antenna-info').innerHTML = "<i>Recherche des antennes en cours...</i>";
                    chercherAntennes(lat, lng);
                }, (erreur) => {
                    document.getElementById('antenna-info').innerHTML = "<b>Erreur :</b> Impossible de vous localiser. Avez-vous autorisé le navigateur ?";
                });
            }
        });

        // 3. Choix des couleurs selon l'opérateur
        function getCouleurOperateur(nomOperateur) {
            if (!nomOperateur) return "#ffffff";
            const nom = nomOperateur.toUpperCase();
            if (nom.includes("ORANGE")) return "#FF7900"; 
            if (nom.includes("FREE")) return "#CC0000";   
            if (nom.includes("SFR")) return "#E2001A";    
            if (nom.includes("BOUYGUES")) return "#009DCC"; 
            return "#888888"; 
        }

        // 4. Appel de la vraie API ANFR
        async function chercherAntennes(lat, lng) {
            const rayon = 3000; // Recherche dans un rayon de 3km
            const url = `https://data.anfr.fr/api/records/1.0/search/?dataset=observatoire_2g_3g_4g&geofilter.distance=${lat},${lng},${rayon}&rows=50`;

            try {
                const reponse = await fetch(url);
                const donnees = await reponse.json();

                if (donnees.records.length === 0) {
                    document.getElementById('antenna-info').innerHTML = "<p>Aucune antenne trouvée dans un rayon de 3km.</p>";
                    return;
                }

                document.getElementById('antenna-info').innerHTML = `<i>${donnees.records.length} antennes trouvées ! Cliquez sur les cercles sur la carte.</i>`;

                donnees.records.forEach(record => {
                    if(!record.fields.coordonnees) return; // Sécurité si une coordonnée manque
                    
                    const antenneLat = record.fields.coordonnees[0];
                    const antenneLng = record.fields.coordonnees[1];
                    const operateur = record.fields.adm_lb_nom || "Inconnu";
                    const technologie = record.fields.generation || "Technologie non précisée";

                    // Ajout du point sur la carte
                    const marqueur = L.circleMarker([antenneLat, antenneLng], {
                        color: getCouleurOperateur(operateur),
                        radius: 8,
                        fillOpacity: 0.8
                    }).addTo(map);

                    // Action au clic sur l'antenne
                    marqueur.on('click', () => {
                        document.getElementById('antenna-info').innerHTML = `
                            <h3 style="margin-top:0; color: ${getCouleurOperateur(operateur)}">${operateur}</h3>
                            <p><b>Réseaux :</b> ${technologie}</p>
                            <p><i>L'antenne est bien active. (L'affichage des fréquences exactes comme 700 ou 2500 arrivera dans la prochaine version !)</i></p>
                        `;
                    });
                });

            } catch (erreur) {
                console.error(erreur);
                document.getElementById('antenna-info').innerHTML = "<p style='color:red;'>Erreur lors de la récupération des antennes.</p>";
            }
        }
    </script>
</body>
</html>
