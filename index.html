<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Réseau Mobile</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="sidebar">
        <h1>Antennes & Réseau</h1>
        <p>Découvrez ce qui se cache autour de vous.</p>
        
        <button id="btn-geoloc">📍 Me géolocaliser</button>
        
        <!-- Recherche avec suggestions -->
        <div class="search-container">
            <input type="text" id="input-adresse" list="suggestions-lieux" placeholder="Ex: Lyon, Paris..." autocomplete="off" />
            <datalist id="suggestions-lieux"></datalist>
            <button id="btn-search">🔍</button>
        </div>
        
        <div class="info-box" id="antenna-info">
            <i>Localisez-vous ou cherchez une adresse pour voir les antennes.</i>
        </div>

        <!-- Section Compte -->
        <div class="account-section">
            <h3 id="user-status">Non connecté</h3>
            <div id="auth-forms">
                <input type="email" id="email" placeholder="Email" />
                <input type="password" id="password" placeholder="Mot de passe" />
                <button id="btn-login">Connexion</button>
                <button id="btn-signup" style="background-color: #444; color: white;">Créer un compte</button>
            </div>
            <button id="btn-logout" style="display: none; background-color: #E2001A; color: white;">Se déconnecter</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
